// Read-only probe: retain original named-endpoint midpoint/slope purpose after explicit prerequisite creation.
gradle.projectsEvaluated {
    def appProject=gradle.rootProject.project(':app')
    appProject.tasks.register('auditRuhiNamedEndpointCreation') {
        doLast {
            def loader=new URLClassLoader(appProject.tasks.named('testDebugUnitTest').get().classpath.files.collect{it.toURI().toURL()} as URL[],ClassLoader.getSystemClassLoader())
            try {
                def prefix='com.indianservers.aiexplorer.assistant.workspace.'
                def fixture=loader.loadClass(prefix+'RuhiDialogueSeedFixture').getField('INSTANCE').get(null)
                def managerClass=loader.loadClass(prefix+'RuhiDialogueManager')
                def historyClass=loader.loadClass('com.indianservers.aiexplorer.workspace.WorkspaceHistoryByModule')
                def modality=loader.loadClass(prefix+'RuhiInputModality').getField('TEXT').get(null)
                def records=[]
                [[id:153,text:'Mark the center point between P and Q',intent:'FIND_MIDPOINT'],[id:178,text:'Calculate rise over run from P to Q',intent:'CALCULATE_SLOPE']].each{input->
                    ['valid_existing_control','missing_P','missing_both'].each{mode->
                        def manager=managerClass.getDeclaredConstructor().newInstance();def setup=historyClass.getDeclaredConstructor(Integer.TYPE).newInstance(80)
                        def s=fixture.state(488,0);def c=fixture.context(s)
                        if(mode=='valid_existing_control')s=manager.execute(s,'Create point P at (0,0)',setup,c,modality).state
                        if(mode!='missing_both')s=manager.execute(s,'Create point Q at (6,8)',setup,c,modality).state
                        def h=historyClass.getDeclaredConstructor(Integer.TYPE).newInstance(80)
                        def q=manager.execute(s,input.text,h,c,modality);def r=q;def replies=[]
                        if(mode!='valid_existing_control') {
                            replies<<'Create point P at (0,0)';r=manager.execute(r.state,replies.last(),h,c,modality)
                            if(mode=='missing_both'){replies<<'Create point Q at (6,8)';r=manager.execute(r.state,replies.last(),h,c,modality)}
                        }
                        def verified=r.status.name()=='APPLIED'&&r.semanticFrame?.intent==input.intent
                        def actualPoint=null;def actualSlope=null
                        if(input.id==153){if(r.state.points.size()==3)actualPoint=[r.state.points.last().x,r.state.points.last().y];verified=verified&&actualPoint==[3.0d,4.0d]&&r.state.pointDependencies.size()==1}
                        else{def match=r.message =~ /Slope = ([-+0-9.eE]+)/;actualSlope=match.find()?Double.parseDouble(match.group(1)):null;verified=verified&&actualSlope!=null&&Math.abs(actualSlope-4.0d/3)<1e-8&&r.state.points.size()==2&&r.state.pointDependencies.isEmpty()}
                        records<<[source_row:input.id,case_name:mode,input:input.text,creation_replies:replies,question_status:q.status.name(),question_reply:q.message,question_suggestions:q.dialogue?.suggestions?.collect{it.label} ?: [],actual_status:r.status.name(),actual_intent:r.semanticFrame?.intent,actual_reply:r.message,actual_point:actualPoint,actual_slope:actualSlope,points:r.state.points.collect{[it.x,it.y]},history_entries:h.forModule(s.module).protocol.size(),behavior_verified:verified]
                    }
                }
                def sources=['RuhiGeometry2DLanguage.kt','RuhiSlopeLanguage.kt','RuhiEndpointConversation.kt','RuhiPointLanguage.kt','RuhiDialogue.kt'].collectEntries{name->def path='app/src/main/java/com/indianservers/aiexplorer/assistant/workspace/'+name;[(path):java.security.MessageDigest.getInstance('SHA-256').digest(new File(appProject.rootDir,path).bytes).encodeHex().toString()]}
                def result=[cases:records.size(),verified:records.count{it.behavior_verified},source_sha256:sources,results:records,scope:'Original explicit named-endpoint rows 153/178 with both points present, P missing, or both missing. Explicit prerequisite point creation replies should retain original midpoint/slope purpose. Independent expected midpoint (3,4) or slope 4/3. Compiled development probe without Android TensorFlow or UI; no source rows or expectations changed.']
                new File(appProject.rootDir,'docs/qa/ruhi-500/named-endpoint-creation-audit.json').text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result))
                records.each{println(it.source_row.toString()+' '+it.case_name+': '+it.behavior_verified+' '+it.actual_status+' '+it.actual_reply)}
            }finally{loader.close()}
        }
    }
}
